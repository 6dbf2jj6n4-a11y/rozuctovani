{% extends "admin/base_site.html" %}
{% load l10n %}

{% block content %}
<div>
    <p style="color:#999; font-size:13px; margin-bottom:20px;">
        Vytvoří všech 12 Období (leden až prosinec) pro zadaný rok najednou. Období, která už
        pro daný rok existují, se přeskočí (nic se nepřepíše).
    </p>
    <form method="post" style="max-width:280px;">
        {% csrf_token %}
        <label for="id_year" style="display:block; font-weight:600; margin-bottom:6px;">Rok</label>
        <input type="number" name="year" id="id_year" min="2000" max="2100" required value="{{ current_year|unlocalize }}"
               style="padding:8px; width:100%; box-sizing:border-box; margin-bottom:20px; border-radius:6px; border:1px solid #d1d5db;">
        <button type="submit" class="rx-btn rx-btn-primary">
            Vygenerovat
        </button>
    </form>
</div>
{% endblock %}
